<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V Congreso de Museos de Canarias</title>
    <!-- Fuente del wordmark (el texto más grande al cargar): precarga para evitar el cambio de fuente. -->
    <link rel="preload" href="/fonts/Kola-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Encuentro profesional sobre museos, patrimonio y públicos." />
    <meta name="theme-color" content="#111311" />
    <script>
      // Oculta los textos con revelado hasta que cargue GSAP (src/app/motion.ts).
      // Sin reduced motion y con un límite de 3 s por si el chunk falla.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var root = document.documentElement
        root.classList.add('motion-pending')
        setTimeout(function () { root.classList.remove('motion-pending') }, 3000)
      }
    </script>
  </head>
  <body>
    <!-- Intro del hero: cortina lima que se retira al cargar (solo CSS, ver .hero-intro). -->
    <div class="hero-intro" aria-hidden="true"></div>
    <script>
      // La intro solo existe en la portada: en otras rutas se quita la cortina.
      if (location.pathname !== '/') document.querySelector('.hero-intro').remove()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
