<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V Congreso de Museos de Canarias</title>
    <!-- Fuente del wordmark (el texto más grande al cargar): precarga para evitar el cambio de fuente. -->
    <link rel="preload" href="/fonts/Kola-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Paisaje del hero en ImageKit: conexión abierta antes de que React pida la imagen. -->
    <link rel="preconnect" href="https://ik.imagekit.io" />
    <meta name="description" content="V Congreso de Museos de Canarias: «Museos en un tiempo de cambios. Diagnosis y perspectiva». San Sebastián de La Gomera, 19-21 de noviembre de 2026. Inscripción gratuita." />
    <!-- Vista previa al compartir (WhatsApp, Facebook, LinkedIn, X): imagen de 1200×630 en public/media. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="V Congreso de Museos de Canarias" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://www.congresodemuseosdecanarias2026.com/" />
    <meta property="og:title" content="V Congreso de Museos de Canarias" />
    <meta property="og:description" content="«Museos en un tiempo de cambios. Diagnosis y perspectiva». San Sebastián de La Gomera, 19-21 de noviembre de 2026. Inscripción gratuita." />
    <meta property="og:image" content="https://www.congresodemuseosdecanarias2026.com/media/compartir.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="V Congreso de Museos de Canarias. Museos en un tiempo de cambios. Diagnosis y perspectiva. San Sebastián de La Gomera, 19-21 de noviembre de 2026." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Datos del evento para Google (resultados enriquecidos de eventos). Bloque de datos: no se ejecuta, la CSP no lo afecta. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "V Congreso de Museos de Canarias",
        "alternateName": "Museos en un tiempo de cambios. Diagnosis y perspectiva",
        "description": "Encuentro profesional de los museos de Canarias: conferencias, mesas plenarias, alegatorios y pósteres sobre la realidad y el futuro de los museos de las islas.",
        "startDate": "2026-11-19",
        "endDate": "2026-11-21",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "inLanguage": "es",
        "isAccessibleForFree": true,
        "url": "https://www.congresodemuseosdecanarias2026.com/",
        "image": ["https://www.congresodemuseosdecanarias2026.com/media/compartir.png"],
        "location": {
          "@type": "Place",
          "name": "Bancal Hotel & Spa",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "C. Lomo de Clavo, 188",
            "postalCode": "38801",
            "addressLocality": "San Sebastián de La Gomera",
            "addressRegion": "Santa Cruz de Tenerife",
            "addressCountry": "ES"
          }
        },
        "organizer": [
          { "@type": "GovernmentOrganization", "name": "Gobierno de Canarias", "url": "https://www.gobiernodecanarias.org/" },
          { "@type": "GovernmentOrganization", "name": "Cabildo Insular de La Gomera", "url": "https://www.lagomera.es/" }
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR",
          "availability": "https://schema.org/InStock",
          "url": "https://www.congresodemuseosdecanarias2026.com/inscripcion"
        }
      }
    </script>
    <meta name="theme-color" content="#2f3529" />
    <script>
      // Oculta los textos con revelado hasta que cargue GSAP (src/app/motion.ts).
      // Sin reduced motion y con un límite de 3 s por si el chunk falla.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var root = document.documentElement
        root.classList.add('motion-pending')
        setTimeout(function () { root.classList.remove('motion-pending') }, 3000)
      }
    </script>
  </head>
  <body>
    <!-- Intro del hero: cortina lima que se retira al cargar (solo CSS, ver .hero-intro). -->
    <div class="hero-intro" aria-hidden="true"></div>
    <script>
      // La intro solo existe en la portada: en otras rutas se quita la cortina.
      if (location.pathname !== '/') document.querySelector('.hero-intro').remove()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
